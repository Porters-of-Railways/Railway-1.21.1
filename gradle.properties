enable_tfc = false

# Tweakeroo
# https://www.curseforge.com/minecraft/mc-mods/malilib/files
malilib_version = 4623483
# https://www.curseforge.com/minecraft/mc-mods/tweakeroo/files
tweakeroo_version = 4623488
