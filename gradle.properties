org.gradle.jvmargs = -Xmx3G
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.daemon = true

# Mod Info
mod_id = railways
mod_name = Steam 'n' Rails 1.21
mod_authors = The Railways Team, PoppyBlossom & Chameleon538
mod_description = Unofficial port of Steam 'n' Rails to Minecraft 1.21.1
mod_license = LGPL-3.0
archives_base_name = Steam_Rails
mod_version = 0.3.0-beta.2
maven_group = com.railwayteam.railways
minecraft_version_range = [1.21,1.22)
neoforge_version_range = [21.1,)

minecraft_version = 1.21.1

# Mappings
# https://parchmentmc.org/docs/getting-started
parchment_version = 2023.07.16

# NeoForge (Forge split into NeoForge for MC 1.20.5+)
# https://projects.neoforged.net/neoforged/neoforge
# NeoForge for MC 1.21.1
# Keep this on the latest NeoForge 21.1.x line compatible with Minecraft 1.21.1.
# Updated to meet Create's minimum requirement of 21.1.200+
neoforge_version = 21.1.233

# Create - Forge (1.21.1)
# https://maven.createmod.net/com/simibubi/create/create-1.21.1/
create_forge_version = 6.0.11-312
# Catnip, Ponder, and Flywheel must be added explicitly (shaded or embedded into Create)
# https://maven.createmod.net/net/createmod/catnip/Catnip-NeoForge-1.21.1/
catnip_version = 0.8.54
# https://maven.createmod.net/net/createmod/ponder/Ponder-NeoForge-1.21.1/
ponder_version = 1.0.87
# https://maven.createmod.net/dev/engine-room/flywheel/flywheel-neoforge-1.21.1/
flywheel_version = 1.0.7-48
# Registrate for 1.21 snapshots are published on mvn.devos.one; use latest known snapshot
# https://mvn.devos.one/snapshots/com/tterrag/registrate/Registrate/
# Using MC1.21-1.3.0+62 to match Create's dependency and avoid module conflicts
registrate_forge_version = MC1.21-1.3.0+67

# Mixin Extras
# https://github.com/LlamaLad7/MixinExtras
mixin_extras_version = 0.5.5

# Development QOL
# JEI - https://www.curseforge.com/minecraft/mc-mods/jei/files
# JEI 10+ seems to have issues on Forge, so the versions must be different for now. # 1.19 edit: no version < 11 exists, so use that
#
# Recipe viewer versions are intentionally not declared here: this NeoForge build
# does not add a recipe viewer to its runtime classpath.
# REI - https://modrinth.com/mod/rei/versions
rei_version = 16.0.799+neoforge
# EMI - https://modrinth.com/mod/emi/versions (https://maven.terraformersmc.com/releases/dev/emi/emi-fabric)
emi_version = 1.1.24+1.21.1+neoforge

# Compat

# Journeymap - https://www.curseforge.com/minecraft/mc-mods/journeymap/files/all
journeymap_version = 1.21.1-6.0.9
# https://jm.gserv.me/#browse/browse:maven-public
# info/journeymap/journeymap-api
journeymap_api_version = 1.21-2.0

# Mod compatibility

# Simple Voice Chat - https://modrepo.de/minecraft/voicechat/api/getting_started
# https://modrinth.com/plugin/simple-voice-chat
voicechat_version = 1.21.1-2.6.16
voicechat_api_version = 2.6.0
# https://maven.maxhenkel.de/#/releases/de/maxhenkel/voicechat/voicechat-api
enable_simple_voice_chat = false

# Hex Casting
# https://modrinth.com/mod/hex-casting/versions
# Not updated yet
hexcasting_version = 0.10.3
# https://modrinth.com/mod/paucal/versions
paucal_version = 0.6.0-pre-118
# https://modrinth.com/mod/patchouli/versions
patchouli_version = 81
# https://modrinth.com/mod/pehkui/versions
pehkui_version = 3.7.7
# https://modrinth.com/mod/kotlin-for-forge/versions
kotlin_for_forge_version = 4.4.0
enable_hexcasting = false

# Oh The Biomes You'll Go
# https://modrinth.com/mod/biomesyougo/versions
# Not updated yet
byg_version = null
enable_byg = false

# Biomes O' Plenty
# https://www.curseforge.com/minecraft/mc-mods/biomes-o-plenty/files
bop_version = 4764804
enable_bop = false

# Natures Spirit
# https://modrinth.com/mod/natures-spirit
natures_spirit_version = cUt9cfpK
enable_natures_spirit = false

# Create: Dreams and Desires
# https://modrinth.com/mod/create-dreams-and-desires
dnd_version = uzrt7Ops
enable_dnd = false

# Quark
# https://maven.blamejared.com/org/violetmoon/quark/Quark/
# https://maven.blamejared.com/org/violetmoon/zeta/Zeta/
quark_version = 4.0-436.3287
zeta_version = 1.0-14.60
enable_quark = false

# Terrafirmacraft
# https://modrinth.com/mod/terrafirmacraft
